[package]
name = "photo_picker"
version = "1.0.0"
description = "VXPhotos — Lightweight Photo Picker & Media Triage Utility"
authors = ["vic"]
edition = "2021"

[lib]
name = "photo_picker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
rfd = "0.15"
url = "2"
uuid = { version = "1", features = ["v4"] }
kamadak-exif = "0.6"
chrono = "0.4"
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_System_Ole",
] }
